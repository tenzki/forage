services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: forage
      POSTGRES_PASSWORD: forage
      POSTGRES_DB: forage_test
    ports:
      - "127.0.0.1:55437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forage -d forage_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - forage-postgres-data:/var/lib/postgresql/data

volumes:
  forage-postgres-data:
