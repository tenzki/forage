[package]
name = "forage"
version = "0.1.0"
description = "Forage — an AI-assisted outliner"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "forage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.53.1", features = ["rt", "time", "macros", "sync"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rand = "0.9.5"
