[package]
name = "ai-chat"
version = "0.1.0"
description = "A Tauri App"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
